# A1 — Acoustic health/abnormality classifier (the reusable audio encoder).
# See docs/ai-model-plan.md (A1). Build the manifest first:
#   python scripts/build_audio_manifest.py \
#     --root PhdThesis/Data/downloads/mendeley_vocalization/Chicken_Audio_Dataset \
#     --out poultryai/tasks/audio/manifest.csv
seed: 42
run_name: audio_cnn_v1

data:
  manifest: poultryai/tasks/audio/manifest.csv
  sample_rate: 16000        # resample 48k -> 16k
  window_s: 4.0
  hop_s: 2.0                # train-time overlap (50%)
  max_windows: 20           # cap windows per recording (balance long clips)

model:
  encoder: cnn              # cnn (edge) | ast (server)
  d_model: 128
  n_mels: 64
  n_fft: 1024
  hop_length: 256
  init_encoder: null        # A2: path to SSL-pretrained encoder (artifacts/audio_ssl/encoder.pt)

train:
  max_epochs: 40
  batch_size: 32
  lr: 3.0e-4
  weight_decay: 1.0e-2
  precision: 16-mixed       # ignored on CPU
  num_workers: 4
  class_weighted_loss: true
  label_smoothing: 0.05
  early_stop_metric: val/macro_f1
  early_stop_mode: max
  patience: 8

export:
  onnx: true
  onnx_path: artifacts/audio_cnn.onnx

logging:
  tracker: mlflow           # mlflow | none
  experiment: poultry-audio
  out_dir: artifacts/audio
