[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poultryai"
version = "0.1.0"
description = "Multimodal early-warning models for industrial poultry automation (PhD, Rasht Science and Research Branch of Iran Open University)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary — academic" }
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "torch>=2.2",
    "torchaudio>=2.2",
    "pytorch-lightning>=2.2",
    "scikit-learn>=1.4",
    "onnx>=1.16",
]

[project.optional-dependencies]
edge = ["onnxruntime>=1.17", "paho-mqtt>=2.0"]      # RPi4 runtime, no training stack
audio = ["librosa>=0.10"]                            # optional WST / extra features
track = ["mlflow>=2.12"]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
